<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Leaflet JS - Flores Timur</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet Awesome Markers CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }

        .popup-image {
            width: 200px;
            margin-top: 8px;
            border-radius: 4px;
        }

        /* Scale Bar like Google Maps */
        .leaflet-control-scale-line {
            border: 2px solid #000 !important;
            border-top: none !important;
            background: rgba(255, 255, 255, 0.5) !important;
            color: black !important;
            font-weight: bold;
            font-size: 11px !important;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
            border-bottom-left-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            padding: 2px 5px !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/" target="_blank"><i
                                class="fa-solid fa-link"></i> SV UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#infoModal"><i
                                class="fa-solid fa-circle-info"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="map"></div>

    <!-- Modal -->
    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="infoModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered mb-0">
                        <tr>
                            <th>Nama</th>
                            <td>Rifkya Firman Alhapsi</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/568773/SV/27530</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>PGWEB A</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Feature Modal -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle">Informasi Feature</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>

    <!-- Leaflet Awesome Markers JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>


    <script>

        // =====================================================
        // INISIALISASI PETA
        // =====================================================

        var map = L.map("map").setView(
            [-8.3234395, 123.0159760],
            10
        );

        // =====================================================
        // MAP PANES
        // =====================================================
        map.createPane('pane_jalan');
        map.getPane('pane_jalan').style.zIndex = 400;

        map.createPane('pane_jumlah_penduduk');
        map.getPane('pane_jumlah_penduduk').style.zIndex = 300;


        // =====================================================
        // TILE LAYER BASE MAP
        // =====================================================

        var basemap = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution:
                    'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            }
        );


        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);



        // =====================================================
        // GEOJSON POINT TOPONIMI
        // =====================================================

        var Toponimi = L.geoJSON(null, {

            // Style Point
            pointToLayer: function (feature, latlng) {
                var jenis = feature.properties.NAMA_UNSUR;
                var markerIcon, markerColor;

                if (jenis === "Gunung") {
                    markerIcon = "mountain";
                    markerColor = "green";
                } else if (jenis === "Tanjung") {
                    markerIcon = "anchor";
                    markerColor = "blue";
                } else if (jenis === "Teluk") {
                    markerIcon = "water";
                    markerColor = "cadetblue";
                } else if (jenis === "Toponimi") {
                    markerIcon = "location-dot";
                    markerColor = "orange";
                } else {
                    markerIcon = "info-circle";
                    markerColor = "gray";
                }

                var awesomeIcon = L.AwesomeMarkers.icon({
                    icon: markerIcon,
                    prefix: 'fa',
                    markerColor: markerColor
                });

                return L.marker(latlng, {
                    icon: awesomeIcon
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {

                var nama = feature.properties.TOPONIMI;
                var jenis = feature.properties.NAMA_UNSUR;
                var image = feature.properties.image;

                var koordinat =
                    feature.geometry.coordinates[1] +
                    ", " +
                    feature.geometry.coordinates[0];


                // Variable popup content
                var popup_content = 
                    "<div class='text-center'>" +
                        "<h6 class='fw-bold mb-1'>" + nama + "</h6>";

                // Jika memiliki gambar
                if (image !== null && image !== "" && image !== undefined) {
                    popup_content += "<img src='images/" + image + "' class='popup-image mb-2' alt='" + nama + "'>";
                }

                popup_content +=
                    "</div>" +
                    "<table class='table table-sm table-bordered mb-0 mt-2'>" +
                        "<tr><th>Jenis</th><td>" + jenis + "</td></tr>" +
                        "<tr><th>Koordinat</th><td>" + koordinat + "</td></tr>" +
                    "</table>";


                // Popup
                layer.bindPopup(popup_content);


                // Tooltip
                layer.bindTooltip(
                    nama,
                    {
                        direction: "left",
                        sticky: true
                    }
                );

            }

        });


        // Memanggil GeoJSON Toponimi
        $.getJSON(
            "data/toponimi.geojson",
            function (data) {

                Toponimi.addData(data);

                map.addLayer(Toponimi);

            }
        );



        // =====================================================
        // GEOJSON POLYLINE JALAN
        // =====================================================

        var jalan = L.geoJSON(null, {

            pane: 'pane_jalan',

            // Style Jalan
            style: function (feature) {
                var fungsi = feature.properties.NAMA_UNSUR || "";
                if (fungsi.toLowerCase().includes("provinsi") || fungsi.toLowerCase().includes("propinsi")) {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 3
                    };
                } else if (fungsi.toLowerCase().includes("kabupaten")) {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 1.5,
                        dashArray: "10, 10"
                    };
                } else {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 0.5,
                        dashArray: "3, 3"
                    };
                }
            },


            // onEachFeature
            onEachFeature: function (feature, layer) {

                var fungsi =
                    feature.properties.NAMA_UNSUR;

                var panjang =
                    feature.properties.panjang_km;


                // Variable popup content
                var popup_content =

                    "<b>Fungsi:</b> " +
                    fungsi +

                    "<br>" +

                    "<b>Panjang (km):</b> " +
                    Number(panjang).toFixed(3);


                // Popup
                layer.bindPopup(popup_content);


                // Tooltip
                layer.bindTooltip(
                    fungsi,
                    {
                        direction: "auto",
                        sticky: true
                    }
                );

            }

        });


        // Memanggil GeoJSON Jalan
        $.getJSON(
            "data/jalan.geojson",
            function (data) {

                jalan.addData(data);

                map.addLayer(jalan);

            }
        );



        // =====================================================
        // GEOJSON POLYGON JUMLAH PENDUDUK
        // =====================================================

        var jumlah_penduduk = L.geoJSON(null, {

            pane: 'pane_jumlah_penduduk',

            // Style berdasarkan jumlah penduduk
            style: function (feature) {

                var penduduk =
                    feature.properties.Penduduk;


                // Kelas 1
                if (penduduk <= 12000) {

                    return {

                        opacity: 1,
                        color: "black",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "#ffffb2"

                    };

                }


                // Kelas 2
                if (
                    penduduk > 12000 &&
                    penduduk <= 24000
                ) {

                    return {

                        opacity: 1,
                        color: "black",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "#fd8d3c"

                    };

                }


                // Kelas 3
                if (penduduk > 24000) {

                    return {

                        opacity: 1,
                        color: "black",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "#bd0026"

                    };

                }

            },


            // onEachFeature
            onEachFeature: function (feature, layer) {

                var kecamatan =
                    feature.properties.WADMKC;

                var penduduk =
                    feature.properties.Penduduk;

                var luas =
                    feature.properties.luas_km2;


                // Event onClick
                layer.on("click", function (e) {
                    var content = "<table class='table table-striped table-bordered mb-0'>" +
                        "<tr><th>Kecamatan</th><td>" + kecamatan + "</td></tr>" +
                        "<tr><th>Jumlah Penduduk</th><td>" + Number(penduduk).toLocaleString("id-ID") + " jiwa</td></tr>" +
                        "<tr><th>Luas</th><td>" + Number(luas).toFixed(3) + " km&sup2;</td></tr>" +
                        "</table>";
                    $("#featureModalTitle").html("Informasi Penduduk");
                    $("#featureModalBody").html(content);
                    var featureModal = new bootstrap.Modal(document.getElementById('featureModal'));
                    featureModal.show();
                });


                // Tooltip
                layer.bindTooltip(
                    kecamatan,
                    {
                        direction: "auto",
                        sticky: true
                    }
                );

            }

        });


        // Memanggil GeoJSON Jumlah Penduduk
        $.getJSON(
            "data/jumlah_penduduk.geojson",
            function (data) {

                jumlah_penduduk.addData(data);

                map.addLayer(jumlah_penduduk);

            }
        );



        // =====================================================
        // CONTROL LAYER
        // =====================================================

        var baseMaps = {

            "Citra Satelit (Esri)": basemap

        };


        var overlayMaps = {
            "Toponimi": Toponimi,
            "Jaringan Jalan": jalan,
            "Kepadatan Penduduk": jumlah_penduduk
        };


        var controllayer =
            L.control.layers(
                baseMaps,
                overlayMaps
            );


        controllayer.addTo(map);


        // =====================================================
        // SCALE CONTROL (Google Maps Style)
        // =====================================================
        L.control.scale({
            metric: true,
            imperial: false,
            position: "bottomright"
        }).addTo(map);

        // =====================================================
        // LEGENDA (STYLE PETA RBI)
        // =====================================================
        var legend = L.control({ position: 'bottomleft' });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.style.backgroundColor = "white";
            div.style.padding = "10px";
            div.style.borderRadius = "5px";
            div.style.border = "2px solid rgba(0,0,0,0.2)";
            div.style.lineHeight = "1.5";
            div.style.fontFamily = "Arial, sans-serif";
            div.style.fontSize = "12px";
            div.style.color = "#333";

            var html = "<h6 style='text-align: center; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 10px;'>LEGENDA</h6>";

            // Toponimi
            html += "<b>Toponimi</b><br>";
            html += "<i class='fa fa-mountain' style='color: green; width: 20px; text-align: center;'></i> Gunung<br>";
            html += "<i class='fa fa-anchor' style='color: blue; width: 20px; text-align: center;'></i> Tanjung<br>";
            html += "<i class='fa fa-water' style='color: cadetblue; width: 20px; text-align: center;'></i> Teluk<br>";
            html += "<i class='fa fa-location-dot' style='color: orange; width: 20px; text-align: center;'></i> Toponimi Lain<br><br>";

            // Jalan
            html += "<b>Jaringan Jalan</b><br>";
            html += "<svg width='30' height='10' style='vertical-align: middle; margin-right: 5px;'><line x1='0' y1='5' x2='30' y2='5' stroke='red' stroke-width='3' /></svg> Jalan Provinsi<br>";
            html += "<svg width='30' height='10' style='vertical-align: middle; margin-right: 5px;'><line x1='0' y1='5' x2='30' y2='5' stroke='red' stroke-width='1.5' stroke-dasharray='10, 10' /></svg> Jalan Kabupaten<br>";
            html += "<svg width='30' height='10' style='vertical-align: middle; margin-right: 5px;'><line x1='0' y1='5' x2='30' y2='5' stroke='red' stroke-width='0.5' stroke-dasharray='3, 3' /></svg> Jalan Lain<br><br>";

            // Jumlah Penduduk
            html += "<b>Kepadatan Penduduk</b><br>";
            html += "<i style='background: #ffffb2; width: 15px; height: 15px; display: inline-block; vertical-align: middle; border: 1px solid black; margin-right: 5px;'></i> &le; 12.000 jiwa<br>";
            html += "<i style='background: #fd8d3c; width: 15px; height: 15px; display: inline-block; vertical-align: middle; border: 1px solid black; margin-right: 5px;'></i> 12.000 - 24.000 jiwa<br>";
            html += "<i style='background: #bd0026; width: 15px; height: 15px; display: inline-block; vertical-align: middle; border: 1px solid black; margin-right: 5px;'></i> &gt; 24.000 jiwa<br>";

            div.innerHTML = html;
            return div;
        };

        legend.addTo(map);

    </script>

</body>

</html>
